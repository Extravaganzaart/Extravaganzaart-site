<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request the Price</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
   (function(){
      emailjs.init("O8EaQ5AUQ0y-nsLTM");
   })();
</script>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    padding: 30px;
}

/* Анимация плавного появления */
.fade-in {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeInUp 0.6s ease forwards;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
}

.container {
    max-width: 520px;
    margin: auto;
    background: #111;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 0 12px rgba(255,255,255,0.08);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

label {
    display: block;
    margin-top: 15px;
    color: #ffcc66;
    font-size: 14px;
}

select, input, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border-radius: 8px;
    border: none;
    background: #222;
    color: #fff;
    font-size: 14px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 25px;
    background: #ffcc66;
    color: #000;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 15px;
}

.lang-switch {
    text-align: center;
    margin-bottom: 20px;
}

.lang-switch button {
    background: #222;
    color: #fff;
    border: 1px solid #333;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin: 0 5px;
}

#successMessage {
    display: none;
    background: #0a0;
    padding: 12px;
    border-radius: 8px;
    margin-top: 20px;
    text-align: center;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="lang-switch fade-in">
    <button onclick="setLang('en')">English</button>
    <button onclick="setLang('ru')">Русский</button>
</div>

<div class="container fade-in">

    <!-- ENGLISH -->
    <div id="form-en">
        <h2>Request the Price</h2>
        <p><strong>Artwork:</strong> <span id="artNameEn"></span></p>

        <label>Artwork format</label>
        <select id="formatEn">
            <option>Digital</option>
            <option>Canvas</option>
            <option>Glass</option>
            <option>Wood</option>
            <option>Vinyl</option>
            <option>Wallpaper</option>
        </select>

        <label>Your email</label>
        <input type="email" id="emailEn" placeholder="example@mail.com">

        <label>Message</label>
        <textarea id="messageEn" rows="6" placeholder="Write your request here..."></textarea>

        <button onclick="sendForm('en')">Send Request</button>
    </div>

    <!-- RUSSIAN -->
    <div id="form-ru" style="display:none;">
        <h2>Запросить стоимость</h2>
        <p><strong>Картина:</strong> <span id="artNameRu"></span></p>

        <label>Формат картины</label>
        <select id="formatRu">
            <option>Цифра</option>
            <option>Холст</option>
            <option>Стекло</option>
            <option>Дерево</option>
            <option>Винил</option>
            <option>Фотообои</option>
        </select>

        <label>Ваш email</label>
        <input type="email" id="emailRu" placeholder="example@mail.com">

        <label>Сообщение</label>
        <textarea id="messageRu" rows="6" placeholder="Напишите ваш запрос..."></textarea>

        <button onclick="sendForm('ru')">Отправить запрос</button>
    </div>

    <div id="successMessage"></div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const artName = params.get("name");

// Insert artwork name
document.getElementById("artNameEn").textContent = artName;
document.getElementById("artNameRu").textContent = artName;

// Language switch
function setLang(lang) {
    document.getElementById("form-en").style.display = lang === 'en' ? 'block' : 'none';
    document.getElementById("form-ru").style.display = lang === 'ru' ? 'block' : 'none';
}

// Sending form
function sendForm(lang) {
    const email = lang === 'en' ? document.getElementById("emailEn").value.trim()
                               : document.getElementById("emailRu").value.trim();

    const format = lang === 'en' ? document.getElementById("formatEn").value
                                 : document.getElementById("formatRu").value;

    const message = lang === 'en' ? document.getElementById("messageEn").value.trim()
                                  : document.getElementById("messageRu").value.trim();

    if (!email) {
        alert(lang === 'ru' ? "Введите email" : "Enter your email");
        return;
    }

    emailjs.send("service_27ysf4b", "template_98vtk46", {
        name: artName,
        email: email,
        message:
            "Artwork: " + artName +
            "\nFormat: " + format +
            "\nMessage: " + message
    }).then(() => {
        const box = document.getElementById("successMessage");
        box.style.display = "block";
        box.textContent = lang === 'ru'
            ? "Ваш запрос отправлен. Я свяжусь с вами в ближайшее время."
            : "Your request has been sent. I will contact you shortly.";
    });
}
</script>

</body>
</html>
